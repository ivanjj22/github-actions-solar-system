name: Solar System Workflow

env:
  MONGO_URI: "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container: 
          image: 'node:20'
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        # - name: Setup NodeJS Version
        #   uses: actions/setup-node@v4
        #   with:
        #     node-version: 20
        
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: '${{ runner.os }}-node-modules-${{ hashFiles(''package-lock.json'') }}'
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: Code coverage
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4
          
          - name: Setup NodeJS Version
            uses: actions/setup-node@v4
            with:
              node-version: 18
          
          - name: Install Dependencies
            run: npm install
          
          - name: Run coverage
            run: npm run coverage
            continue-on-error: true
          
          - name: Archive Test Result
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: Code-Coverage-Result
              path: coverage
              retention-days: 5
    
    docker:
      name: Docker
      needs: [code-coverage, unit-testing]
      runs-on: ubuntu-latest
      permissions: 
        packages: write
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        
        - name: Docker login
          uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Docker push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
  
    dev-deploy:
        runs-on: ubuntu-latest
        name: Dev deploy
        needs: docker
        environment: 
          name: development
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4
          
          - name: Configure kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: 'v1.26.0'
          
          - name: Set context
            uses: azure/k8s-set-context@v3          
            with:
              method: kubeconfig
              kubeconfig: ${{ secrets.KUBECONFIG }}
          
          - name: Run kubectl command
            run: kubectl version --short -o yaml
          
          - name: Set env var
            run: echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV 
          
          - name: replace tokens
            uses: cschleiden/replace-tokens@v1
            with:
              files: '["kubernetes/development/*.yaml"]'
            env:
              NAMESPACE: ${{ vars.NAMESPACE }}
              REPLICAS: ${{ vars.REPLICAS }}
              IMAGE: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
              INGRESS_IP: ${{ env.INGRESS_IP }}

          - name: check files
            run: cat kubernetes/development/*.yaml

        